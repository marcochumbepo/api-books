name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ms-books.sln

      - name: Build
        run: dotnet build ms-books.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ms-books.sln --configuration Release --no-build --verbosity normal

  docker:
    name: Docker Build, Push & Deploy
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and Push Docker image
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/ms-books:${{ github.sha }} .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/ms-books:${{ github.sha }}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name ms-books \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/ms-books:${{ github.sha }} \
            --set-env-vars \
              "Database__Provider=InMemory" \
              "ASPNETCORE_ENVIRONMENT=Production" \
              "Jwt__SecretKey=${{ secrets.JWT_SECRET_KEY }}" \
              "Jwt__Issuer=MsBooks" \
              "Jwt__Audience=MsBooks" \
              "Jwt__ExpirationMinutes=60"
